# Konfigurasi Netlify untuk aplikasi PSB (base directory: apps/psb)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = []
  external_node_modules = ["pg-native"]

# Aset hasil build boleh di-cache lama
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# SPA: semua rute non-API diarahkan ke index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
